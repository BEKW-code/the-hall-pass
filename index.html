ative;max-width:430px;width:100%;filter:drop-shadow(0 25px 18px #0006);transform:rotate(-8deg);transition:transform .5s}.passWrap:hover{transform:rotate(-2deg) scale(1.025)}.passWrap.flipped{transform:rotate(4deg) scale(1.04)}.passSvg{width:100%;height:auto;display:block}.passCaption{color:#bfd1cb;font-size:12px;text-align:center;margin-top:24px;font-weight:700}.passMessage{font-family:ui-monospace,monospace;color:var(--accent);text-align:center;font-size:13px;margin-top:8px;min-height:20px}

<script>
'use strict';
const COURSE={"shops":[{"id":"core","name":"The First Bell","short":"Orientation","icon":"◉","tagline":"Welcome to the shop. Keep your original parts.","intro":"Six courses, five trade shops. That first shop pass will get you through every door. The mission is knowing what machines can do—and what they can do to you.","legend":"The instructor once handed a kid an aluminum hall pass. “You made this? HERE?” That question changed a life. The answer to today’s test begins with another question: “You like your eyes?”","briefings":[["01 / THE EYEBALL AGREEMENT","You like your eyes? Enjoy seeing stuff? Wear impact-rated eye protection selected for the hazard. Side protection matters for flying chips. A face shield may add coverage; it does not automatically replace safety glasses."],["02 / EARS ARE NOT SPARE PARTS","Noise injury accumulates. OSHA’s general-industry hearing conservation action level is 85 dBA as an eight-hour time-weighted average. That is not a magical “safe below this” line. Choose protection and reduce exposure early."],["03 / FIND THE ENERGY","Electrical, gravity, motion, air pressure, springs, and heat can all store trouble. Stopping a motor is not always isolating it. Learn authorized lockout/tagout procedures and verify zero-energy states."],["04 / LOOK BEFORE YOU LEAP","Read labels and safety data sheets, keep exits clear, know eyewash and alarm locations, report near misses. Asking “who knows this machine?” is a power move, not a weakness."]],"tasks":[{"id":"C01","type":"audit","title":"The shop doorway","scene":"The bell rang. The foreman asks what in this scene would stop you before entering.","options":["A grinder throws sparks behind a missing guard","Impact-rated glasses and side shields are on the PPE rack","Extension cord insulation is cracked near a puddle","Exit doors are unobstructed and marked","An unlabeled solvent bottle sits beside the bench","A posted machine manual is readable"],"correct":[0,2,4],"lesson":"You found energy, exposure, and communication hazards before work began. A clean-looking shop can still hold dangerous surprises.","tip":"Risk is not limited to fast-moving blades. Ask what could strike, energize, ignite, or be mistaken for something else.","wrong":"The danger picture isn’t complete. Scan for an unlabeled substance, an exposed energy path, and missing protection."},{"id":"C02","type":"choice","title":"Congratulations. Your eyes work.","scene":"A student says, “I already wear prescription glasses. That means I’m covered on the lathe, right?”","options":["Yes; corrective lenses are always industrial impact protection","Use appropriately rated safety eyewear over prescriptions or rated prescription safety glasses with required side protection","Only a face shield is needed","Squint during the cut and look away"],"correct":[1],"lesson":"Regular prescription glasses are not automatically rated safety eyewear. Required eye and side protection must match the job. A face shield can be additional protection for face hazards.","tip":"Look for protection *designed for the hazard*, not merely something transparent in front of the eyes.","wrong":"Fashionable, useful vision correction does not prove impact resistance."},{"id":"C03","type":"multi","title":"Dress code: fewer loose ends","scene":"You are heading into a shop with a drill press, loud tools, and sharp debris. Select every preparation that belongs on the checklist.","options":["Tie back long hair and secure dangling items","Wear the hazard-selected safety eyewear","Bring loose gloves for rotating shafts","Use appropriate hearing protection when required","Leave hoodie drawstrings hanging for personality","Wear secure, suitable footwear"],"correct":[0,1,3,5],"lesson":"PPE helps, but secure clothing and hair matter just as much near rotating machinery. Gloves can become entanglement hazards around rotating work.","tip":"Think about anything that can catch, strike, enter an eye, or damage hearing.","wrong":"One of the proposed protections can become a hazard beside rotating machinery."},{"id":"C04","type":"order","title":"Machine jam: no hero moves","scene":"The feed jams. Put the actions into a safe sequence for an authorized, trained person.","options":["Stop the operation and keep others clear","Follow the machine-specific isolation and lockout procedure","Control stored energy and verify the machine cannot start","Clear the jam using the approved method, then restore service through procedure"],"correct":[0,1,2,3],"lesson":"An emergency stop is for immediate danger; servicing needs proper energy control. Never assume a silent machine is dead.","tip":"Before anyone reaches into a danger zone, what could still move?","wrong":"The sequence still exposes someone to an energy source during clearing."},{"id":"C05","type":"audit","title":"Hear today, hear tomorrow","scene":"In a shared workshop, the instructor hears several competing sounds. What warrants action?","options":["A loud air compressor runs beside unprotected students","Someone reports ringing in their ears after each lab","A noise measurement is being taken to choose controls","Students think shouting over a planer is normal","A suitable hearing protector is stored cleanly","A shop poster explains earplug fit"],"correct":[0,1,3],"lesson":"Noise can injure hearing long before pain provides a warning. Reduce noise at its source, manage exposure, and use correctly fitted protection.","tip":"Exposure and symptoms matter more than whether everyone has learned to tolerate it.","wrong":"Do not confuse “we are used to it” with “it is safe.”"},{"id":"C06","type":"choice","title":"The bottle of mystery","scene":"A spray bottle says “SUPER CLEAN STUFF.” No chemical identity, no instructions. The class wants to use it on a machine.","options":["Smell it to identify it","Mix it with a familiar product and hope","Set it aside, identify its contents through proper labeling/SDS and shop supervision before use","Use extra soap to dilute it"],"correct":[2],"lesson":"Hazard communication depends on knowing what a substance is. The SDS and workplace labeling system are tools, not paperwork confetti.","tip":"What information is missing before anyone can evaluate exposure?","wrong":"“It probably smells normal” is not a hazard assessment."},{"id":"C07","type":"multi","title":"Emergency, not improvisation","scene":"A student gets a chemical splash near the eyes. Choose actions that fit a prepared workplace response.","options":["Alert the instructor and activate emergency response","Use the available eyewash immediately as directed by training and the chemical information","Keep working until class ends","Arrange appropriate medical assessment/follow-up","Try to neutralize it with another chemical"],"correct":[0,1,3],"lesson":"Rapid access to the appropriate eyewash and emergency protocol matters. Unknown chemical reactions are not first aid.","tip":"Think immediate water/eyewash, people, and professional follow-up—not chemistry experiments.","wrong":"An improvised “neutralizer” may make the exposure worse."},{"id":"C08","type":"order","title":"First look: start of shift","scene":"Before a normal shift, sort this general readiness check into a sensible sequence. Permission to work and final clearance to operate are separate checks.","options":["Confirm authorization and appropriate training for the assigned task","Identify the task and its hazards","Inspect machine, guards, cords, work area, and available controls","Select and fit task-appropriate protection; verify the setup is safe before operating"],"correct":[0,1,2,3],"lesson":"First confirm you are authorized and trained for the work. Identify hazards, inspect equipment and controls, and verify appropriate protection and a safe setup before operating. Authorization is not permission to skip safety checks.","tip":"Distinguish permission to undertake a task from the final check before operating equipment.","wrong":"Separate initial authorization from final machine readiness. Neither replaces identifying hazards or checking controls."}]},{"id":"paint","name":"Paint & Decorating","short":"Painting","icon":"▤","tagline":"Making walls beautiful without redecorating your lungs.","intro":"Brush, roller, spray, prep, ladder, chemicals, and dust. The difference between an elegant finish and a terrifying incident is usually preparation.","legend":"The paint shop is where chemistry dresses like color theory and hopes you forget the chemistry.","briefings":[["01 / THE LABEL IS A CLUE","Paint, thinner, remover, and cleaner can differ drastically. Read the label and SDS. Select ventilation and protection based on the actual coating, process, and exposure."],["02 / SPRAY IS A DIFFERENT ANIMAL","Flammable spray-finishing operations need appropriate booth/area design, ventilation and ignition-source controls. A fan from the garage is not an engineered spray booth."],["03 / DUST IS NOT CONFETTI","Sanding creates airborne particles; old coatings may require lead or other contaminant assessment before disturbance. Local extraction and proper respiratory programs beat just holding your breath."],["04 / LADDERS ARE NOT TELESCOPES","Select stable access equipment for height and task. Keep three points of contact while climbing, position appropriately, and never lean beyond safe reach."]],"tasks":[{"id":"P01","type":"audit","title":"The fancy spray corner","scene":"The booth has been set up for a solvent-based coating. Select every stop-work clue.","options":["A portable household fan sits in the spray mist path","A powered, suitable spray area is inspected","An open solvent container is beside a heater","Coating and SDS are identified","Spray residue builds around an unmaintained exhaust","Workpieces have suitable grounded setup where needed"],"correct":[0,2,4],"lesson":"Flammable vapors and overspray need ventilation, equipment selection, ignition control, and maintenance together—not one heroic fan.","tip":"Think ignition sources, vapor control and containment of residues.","wrong":"If fumes can reach a spark, paint can become a very expensive special effect."},{"id":"P02","type":"choice","title":"The world’s worst sniff test","scene":"Your new job involves a product with unfamiliar solvent vapors. Somebody hands you a dust mask.","options":["A dust mask filters any vapor if worn tight","Check SDS/exposure, use proper ventilation, and follow the required respirator selection, medical evaluation and fit-testing program","Two dust masks equal one vapor cartridge","Close the windows and spray faster"],"correct":[1],"lesson":"Particulate masks are not universal protection against organic vapors. Respirator selection, fit-testing and training follow the actual hazard; ventilation is central.","tip":"Dust and vapor are different exposure forms.","wrong":"A mask’s appearance does not reveal what it filters."},{"id":"P03","type":"multi","title":"Before the first brushstroke","scene":"Choose the controls that belong in a paint/decorating prep plan.","options":["Identify the coating and read label/SDS","Protect adjacent occupants and manage ventilation","Test every mystery cleaner by smell","Inspect ladders/platforms and floor conditions","Leave solvent-soaked waste piled beside an ignition source","Choose eye, skin and respiratory controls for the process"],"correct":[0,1,3,5],"lesson":"Preparation includes chemistry, access, housekeeping, and protecting other people nearby.","tip":"Ask: exposure, ignition, falls, and innocent bystanders.","wrong":"“We’ve always done it this way” does not make a rag pile flameproof."},{"id":"P04","type":"order","title":"A suspicious old wall","scene":"A renovation crew wants to dry-sand an unknown old coating. Put the responsible workflow in order.","options":["Stop disturbance until coating hazards are assessed","Identify likely contaminants and required procedures with qualified direction","Set up approved containment, ventilation and protective controls","Perform work only under the applicable plan, then clean and verify appropriately"],"correct":[0,1,2,3],"lesson":"Old coatings can contain hazardous substances. Identify the situation before generating dust.","tip":"The first decision is whether sanding should happen at all.","wrong":"A dust cloud is not an acceptable chemical identification method."},{"id":"P05","type":"audit","title":"Ladder comedy hour","scene":"The top corner is just out of reach. Locate the real hazards.","options":["Worker stands on the ladder’s top cap to reach paint","Ladder feet are placed on a stable level surface","A power cord crosses the access path","Painter shifts body outside the ladder side rails","Paint tray is positioned within normal reach","The ladder is inspected before use"],"correct":[0,2,3],"lesson":"Ladder selection, stable footing, three-point contact while climbing, and safe reach are what keep “quick touch-up” from becoming an ambulance story.","tip":"Reach problems are equipment problems; don’t solve them by becoming a human crane.","wrong":"Check the top, the floor, and where the worker’s center of gravity goes."},{"id":"P06","type":"choice","title":"Mixology? Not today.","scene":"Two unlabeled cleaners are on a shelf. A student suggests mixing them to make a “super degreaser.”","options":["Mix in small amounts","Ask someone to taste-test the mixture","Decline; identify products and follow the labeled/SDS instructions and approved procedure","Add fragrance first"],"correct":[2],"lesson":"Never casually mix cleaners or solvents. Incompatible chemicals can create toxic gases, heat, or other hazards.","tip":"Chemical labels are not cocktail recipes.","wrong":"Unknown plus unknown is not an upgraded product."},{"id":"P07","type":"multi","title":"Cleanup has a plot twist","scene":"After solvent-based work, select practices that improve safety.","options":["Use specified containers for solvent-contaminated rags/waste","Keep flammable materials from ignition sources","Return chemicals to labeled, properly stored containers","Pour extra solvent into a storm drain","Check ventilation and cleanup procedure","Leave sprayer energized during service"],"correct":[0,1,2,4],"lesson":"End-of-job cleaning and waste handling are part of the process, not someone else’s problem.","tip":"Consider fire, environmental release, and stored energy.","wrong":"A storm drain is not an authorized chemical disposal system."},{"id":"P08","type":"order","title":"Spray gun clogged","scene":"A trained operator needs to clear a clogged spray assembly. Put the general safe decision sequence in order.","options":["Stop spraying and identify the problem under the equipment procedure","Isolate required power/pressure sources and control stored pressure","Service with approved tools and proper protection","Reassemble, inspect, restore service under the approved procedure"],"correct":[0,1,2,3],"lesson":"Pressurized fluid and atomized chemicals can injure skin and eyes. Proper isolation belongs before clearing or servicing.","tip":"The dangerous part can be pressure even after the trigger stops moving.","wrong":"Do not clear pressurized systems as though they were harmless drinking straws."}]},{"id":"wood","name":"Woodshop","short":"Wood","icon":"▥","tagline":"The wood is not trying to kill you. The rotating metal is indifferent.","intro":"Table saw, planer, jointer, router, drill press, nails, fine dust. You can make a beautiful cabinet without offering the blade a finger.","legend":"A woodshop teaches two things fast: grain direction, and that saw blades never read your confidence résumé.","briefings":[["01 / KICKBACK IS PHYSICS","A board can pinch or twist against a spinning saw blade and be thrown toward the operator. Use the specified guard, riving knife/spreader, fence, feed technique and push aids."],["02 / DUST GETS EVERYWHERE","Fine wood dust is an inhalation hazard and may present a fire/explosion concern in some conditions. Use effective collection, safe housekeeping, and task-selected respiratory protection."],["03 / SPIN-DOWN EXISTS","A blade keeps moving after the switch is off. Keep hands clear, wait for complete stop, and follow isolation procedures before adjustments."],["04 / SETUP EARNS THE CUT","Check stock for embedded hardware, choose stable support, inspect sharpness/guarding, and keep hands off the danger line."]],"tasks":[{"id":"W01","type":"audit","title":"Table saw pre-flight","scene":"Which details in this setup need correction before cutting?","options":["Blade guard is removed for a normal through-cut","Riving knife/spreader is correctly fitted","Narrow stock will be pushed by fingertips close to blade","A suitable push stick is within reach","A board with a visible nail is lined up for cutting","The fence is aligned and secured"],"correct":[0,2,4],"lesson":"The saw is a tool, not a loyalty test. Guards, feed aids, stock inspection and setup reduce predictable injury paths.","tip":"Look at blade contact, trapping wood, and unexpected metal in the stock.","wrong":"The risky choices place hands or hidden objects into the blade’s path."},{"id":"W02","type":"choice","title":"The board launches","scene":"A narrow board pinches near the back of a table saw blade. The apprentice asks what kickback means.","options":["The board is thrown violently back toward the operator","The wood gets slightly dusty","The blade automatically stops","The motor grows a second gearbox"],"correct":[0],"lesson":"Kickback is rapid unintended movement, often toward the operator, caused by binding or improper feed/setup. Prevention matters more than heroic reflexes.","tip":"Which outcome is driven by the blade transferring energy to trapped stock?","wrong":"Kickback is not an amusing name for sawdust."},{"id":"W03","type":"multi","title":"Hands, hair, and sawdust","scene":"Select the correct woodshop habits.","options":["Keep guards and proper push aids in use","Secure long hair and loose accessories","Wear dangling gloves near rotating cutter heads","Use appropriate dust extraction and housekeeping","Clear chips with bare hands while blade coasts","Wait for a complete stop before approaching moving parts"],"correct":[0,1,3,5],"lesson":"The machine may still be moving when it sounds quiet. Use tools for chips and keep body parts away from cutter travel.","tip":"What stays dangerous after you release the switch?","wrong":"Rotating machinery cares very little whether your glove was expensive."},{"id":"W04","type":"order","title":"Blade-change sequence","scene":"An authorized worker must change a saw blade. Arrange the principles in order.","options":["Shut down the equipment using its procedure","Isolate power and control unexpected start-up under the applicable procedure","Verify the blade has stopped and energy is controlled","Change and secure the blade, restore guarding, and return to service after inspection"],"correct":[0,1,2,3],"lesson":"Adjustments should be made only after equipment is prevented from restarting and energy is controlled.","tip":"An off button and a stopped-looking blade are not the complete energy story.","wrong":"Do not put hands near a blade during an uncertain energy state."},{"id":"W05","type":"audit","title":"Shop dust is not seasoning","scene":"A shop is being cleaned after a long day. Find the unsafe details.","options":["Fine dust has accumulated around motors and high ledges","Dust is captured by suitable local collection","A student blasts settled dust into the air with compressed air","A narrow walkway is covered with offcuts and chips","Worn sawdust bags are inspected and replaced","Floor paths are kept clear"],"correct":[0,2,3],"lesson":"Dust control protects breathing, visibility, housekeeping, and, in some circumstances, fire/explosion safety. Avoid simply re-aerosolizing dust.","tip":"Where could loose material go when air or feet move it?","wrong":"Moving dust into the air is not the same as removing it."},{"id":"W06","type":"choice","title":"A warped piece walks in","scene":"The stock is twisted and unstable. A student wants to hold it down against the spinning blade with one palm.","options":["Start faster to keep momentum","Stop and select a safer setup/process for the material using proper support and equipment","Invite another student to hold it near the blade","Remove the guard to see better"],"correct":[1],"lesson":"Unstable stock needs appropriate preparation, workholding, or a different method. More hands near a blade create more risk.","tip":"The problem is how the material is controlled before cutting.","wrong":"Pressure from bare palms is not a substitute for a stable setup."},{"id":"W07","type":"multi","title":"Nailer on the bench","scene":"Choose appropriate practices around powered nailers and fastening tools.","options":["Keep trigger discipline and never aim at someone","Check workpiece and what lies behind it","Follow tool-specific safety and disconnect procedures before service","Treat every nailer as harmless if the air hose is disconnected","Use appropriate eye protection","Use a nailer to test a friend’s reflexes"],"correct":[0,1,2,4],"lesson":"Projectiles, ricochet, and hidden people/materials are the relevant risks. A nailer remains a serious tool.","tip":"Think where the nail goes if it misses the intended path.","wrong":"“Just a joke” is not a projectile safety protocol."},{"id":"W08","type":"order","title":"Make the cut count","scene":"A basic woodshop machine setup follows a deliberate sequence. Put it in order.","options":["Read the plan and inspect stock for defects or embedded metal","Select appropriate machine, guard, blade and support method","Set up and verify guides, workholding, PPE and extraction","Make the cut using the trained method; wait for stop before clearing offcuts"],"correct":[0,1,2,3],"lesson":"Accurate work and safer work often begin with the same thing: disciplined setup.","tip":"You cannot choose the safe guard or feed method before knowing the stock and cut.","wrong":"Clean cuts are produced by planning, not by improvising against a running blade."}]},{"id":"auto","name":"Automotive Mechanics","short":"Mechanics","icon":"⚙","tagline":"Gravity, pressure, heat and a 3,000-pound sense of humor.","intro":"Cars carry stored energy everywhere: springs, batteries, hydraulic systems, hot cooling systems and moving masses. Diagnosis begins with not becoming the next problem.","legend":"A car is a machine full of bad surprises you can predict if you stop treating it like furniture.","briefings":[["01 / GRAVITY IS ALWAYS ON","Use rated lift equipment correctly and appropriate vehicle support according to manufacturer procedures. A hydraulic jack alone is not a safe place to work beneath a vehicle."],["02 / EXHAUST IS NOT FRESH AIR","Internal combustion exhaust contains carbon monoxide. Use suitable exhaust extraction and ventilation; do not run engines in enclosed spaces without controls."],["03 / STORED ENERGY HAS SEASONS","Hot cooling systems are pressurized, springs and airbags store energy, batteries supply current, EV high-voltage equipment requires specialized authorization and procedures."],["04 / CHEMICALS FOLLOW THE JOB HOME","Fuel, brake cleaner, fluids, battery electrolyte, and residues require labeling, ventilation, spill response and disposal decisions."]],"tasks":[{"id":"A01","type":"audit","title":"The discount lift","scene":"A sedan is raised for an underbody inspection. Which clues demand a stop?","options":["A hydraulic floor jack is the sole support","Rated stands are positioned at approved support points","A wheel chock is omitted when the setup requires it","The vehicle is stable and a lift check is documented","A student crawls beneath while another moves the jack handle","The work area is clear"],"correct":[0,2,4],"lesson":"Vehicle support is a system: load rating, condition, points, stability, and a disciplined pre-work check.","tip":"If one hydraulic component fails, what will support the vehicle?","wrong":"The space under the car should not be someone’s experiment in optimism."},{"id":"A02","type":"choice","title":"Engine running indoors","scene":"A tech wants to run a gasoline engine in a closed bay while checking rough idle.","options":["Crack the door one inch","Use appropriate exhaust extraction and ventilation; follow shop procedures","Work faster than the fumes","Wear safety glasses; fumes will respect them"],"correct":[1],"lesson":"Carbon monoxide can accumulate without a useful smell warning. Exhaust extraction and ventilation are core controls.","tip":"This hazard can’t be detected reliably by sniffing.","wrong":"A door crack is not a designed exhaust system."},{"id":"A03","type":"multi","title":"The mechanical energy inventory","scene":"A car looks parked and quiet. Select actual stored-energy hazards to consider.","options":["A compressed suspension spring","A pressurized hot coolant system","An EV high-voltage traction circuit","A printed service manual","An airbag/pretensioner assembly","An empty cardboard box in the trunk"],"correct":[0,1,2,4],"lesson":"“Engine off” does not mean “no energy.” Springs, heat, electricity, pressure and pyrotechnic components require specific procedures.","tip":"Energy can be mechanical, thermal, electrical or chemical.","wrong":"A silent part can still be loaded."},{"id":"A04","type":"order","title":"Working underneath","scene":"Arrange a safe planning sequence for an authorized underbody job.","options":["Identify task, vehicle lifting points, weight and required equipment","Inspect and position suitable lifting/support equipment on stable ground","Raise and secure using the approved vehicle/tool procedure, confirm stability","Begin work only after the support setup passes its checks"],"correct":[0,1,2,3],"lesson":"Rushing under a lifted vehicle skips the step that matters most.","tip":"Know the load and its support points before raising it.","wrong":"Never assume hydraulic pressure alone will keep you safe."},{"id":"A05","type":"audit","title":"Hot engine mystery","scene":"After a road test, the crew crowds a hot engine bay. Which details are hazards?","options":["A hand reaches for the hot coolant cap","The engine is off and temperature is allowed to drop","Loose clothing hangs near a belt/fan area","An electrical connector is inspected by qualified personnel with appropriate isolation","A fuel leak is spotted beside a hot exhaust component","A marked extinguisher is accessible"],"correct":[0,2,4],"lesson":"Heat, fuel, moving parts and residual pressure create interacting hazards. One system’s fault can ignite another.","tip":"Think heat, vapor and moving parts—not just whether the engine is currently idling.","wrong":"The cooling system may remain hot and pressurized after shutdown."},{"id":"A06","type":"choice","title":"That orange cable","scene":"A hybrid vehicle arrives with a damaged orange high-voltage cable. Someone suggests checking it with a generic test lamp.","options":["Use the lamp to see whether it sparks","Treat the high-voltage system as hazardous; isolate area and refer to trained, qualified personnel and manufacturer procedures","Pull the cable free with gloves","Disconnect any battery and assume it is safe"],"correct":[1],"lesson":"EV high-voltage systems require specific training, verification procedures and PPE. Orange cables are a warning signal, not an invitation.","tip":"What makes this system different from an ordinary 12-volt accessory circuit?","wrong":"Generic automotive electrical tools are not automatically suitable for high voltage."},{"id":"A07","type":"multi","title":"The fluid shelf","scene":"Choose appropriate choices when a vehicle leaks an unidentified fluid.","options":["Identify the fluid using safe information and procedures","Keep ignition sources away until hazards are understood","Contain and handle spills using appropriate shop procedures","Taste a drop for confirmation","Drain all fluids into the parking lot","Use task-appropriate gloves and eye protection"],"correct":[0,1,2,5],"lesson":"Unknown fluids need hazard identification and a disposal plan. Fluids can burn, irritate, corrode, or pollute.","tip":"You have labels, SDSs, and professional procedures available. Your tongue is not a sensor.","wrong":"Fluid diagnosis should leave the parking lot and the technician intact."},{"id":"A08","type":"order","title":"Brake job: control before force","scene":"A technician is preparing for a safety-critical brake service. Arrange the planning steps.","options":["Consult vehicle-specific procedures and identify system type/hazards","Prepare correct rated support and approved tools/materials","Secure the vehicle and follow applicable isolation/pressure precautions","Perform prescribed service and verification before releasing vehicle"],"correct":[0,1,2,3],"lesson":"Brakes reward precision, documentation, and verification. “Seems fine” is not a test.","tip":"One must know which system is present before selecting tools and isolation measures.","wrong":"A correct-looking part does not establish a verified safe repair."}]},{"id":"electric","name":"Electricity & Controls","short":"Electricity","icon":"ϟ","tagline":"Electrons are fast. Your assumptions are slower.","intro":"Circuits, panels, grounding, GFCI protection, wiring, meters, isolation. The most useful switch is the one you do not trust blindly.","legend":"Electricity will happily obey physics while ignoring your intentions.","briefings":[["01 / DEAD UNTIL PROVEN? NO.","Treat equipment as energized until properly isolated and verified deenergized by a qualified person using suitable test equipment and procedures. Labels and switches can be wrong."],["02 / GFCI IS A CONTROL","Ground-fault circuit interrupters are protective devices for specified conditions; they do not remove every electrical hazard or replace safe work methods."],["03 / THE CIRCUIT HAS A STORY","Voltage, current, resistance, power, grounding and overcurrent protection must be understood together. Correct equipment ratings matter."],["04 / LOCKS ARE NOT DECORATION","Electrical work follows appropriate electrical safety work practices. Authorized energy control and proof of isolation matter especially before exposing conductors."]],"tasks":[{"id":"E01","type":"audit","title":"The suspicious extension cord","scene":"A practice station contains a variety of power setups. Mark the risk conditions.","options":["Cord insulation is cut at a strain relief","Appropriate receptacles and protected power supply are in place","A plugged-in tool rests in standing water","Cable routing avoids sharp edges","Multiple high-draw tools overload a damaged adaptor","A qualified person inspected the setup"],"correct":[0,2,4],"lesson":"Damaged insulation, moisture and overloads are interacting electrical hazards. A circuit breaker cannot fix a puddle.","tip":"Find paths where current can escape or wiring can overheat.","wrong":"Your skin should never become the circuit’s backup plan."},{"id":"E02","type":"choice","title":"“It’s off,” says the breaker","scene":"The breaker handle is down. An apprentice reaches into the panel. What happens next?","options":["The circuit is automatically proven deenergized","Work proceeds if the panel is quiet","A qualified person follows isolation/lockout procedures and verifies absence of voltage using suitable test equipment","Touch with one finger first"],"correct":[2],"lesson":"A handle position is not proof of zero voltage. Qualified personnel use established methods to control energy and test for absence of voltage.","tip":"A label, a switch and a measurement are three different kinds of evidence.","wrong":"The status of the switch is not sufficient evidence for contact."},{"id":"E03","type":"multi","title":"Safe work setup","scene":"Choose practices consistent with safe electrical preparation.","options":["Identify circuit and all possible energy sources","Use rated, suitable test equipment by a qualified person","Bypass the breaker because it keeps tripping","Deenergize/isolate and verify under applicable procedure","Keep water and damaged cords out of the work area","Assume no backfeed exists because someone says so"],"correct":[0,1,3,4],"lesson":"Electrical safety includes controlling multiple sources and backfeed, equipment condition and qualified verification.","tip":"Imagine multiple possible sources of voltage.","wrong":"The safest answer is not to defeat a protective device."},{"id":"E04","type":"order","title":"Prove it dead","scene":"A qualified worker is preparing an approved deenergized-work task. Arrange the conceptual sequence.","options":["Identify the circuit, hazards and all sources of supply","Deenergize and apply the appropriate energy-isolation/lockout procedure","Use appropriately rated test equipment to verify absence of voltage under the procedure","Only then proceed with the authorized work"],"correct":[0,1,2,3],"lesson":"Verification is a positive action. People do not gain electrical immunity by being very confident.","tip":"Isolation happens before the proof, and proof happens before contact.","wrong":"The proof step cannot be replaced with someone’s assurance."},{"id":"E05","type":"audit","title":"Wet-floor electric carnival","scene":"A workbench is near a wet area. Identify the problems.","options":["A handheld electric tool has a frayed cord","Suitable protection and dry placement have been selected","Someone handles a connected plug with wet hands","A damaged extension is taken out of service","A trainee bypasses a GFCI because it trips","The area is isolated during cleanup"],"correct":[0,2,4],"lesson":"Protective devices tripping is diagnostic information, not a nuisance to defeat.","tip":"Think moisture, compromised insulation, and removed protective barriers.","wrong":"The cause of repeated trips should be found, not hidden."},{"id":"E06","type":"choice","title":"The GFCI legend","scene":"A student claims a GFCI means “all electricity is safe.” Which correction is strongest?","options":["Correct. Every hazard is eliminated","A GFCI can limit certain ground-fault shock risks but does not replace safe practices or protect against all contact scenarios","GFCI stands for “Great Confidence For Idiots”","It only works if you whistle"],"correct":[1],"lesson":"GFCIs detect imbalance and interrupt a circuit for certain fault conditions; they are an important layer of protection, not total immunity.","tip":"One protective device addresses particular failure modes.","wrong":"No single electrical component eliminates all electrical hazards."},{"id":"E07","type":"multi","title":"A hot connector","scene":"An extension connection is discolored and unusually warm. Which responses are reasonable?","options":["Stop use and arrange inspection by a qualified person","Check load/ratings and connection condition under the proper procedure","Hide it under carpet so it cools down","Replace damaged components with appropriate rated equipment","Add more tools to test its limit"],"correct":[0,1,3],"lesson":"Heating and discoloration can indicate poor contacts, overload or other faults. Disconnect and diagnose safely.","tip":"A hot connection is evidence of energy going somewhere unintended.","wrong":"Covering a hot conductor does not repair it."},{"id":"E08","type":"order","title":"A new lab bench","scene":"Arrange the conceptual planning sequence before powering a training circuit.","options":["Read the circuit plan and determine operating ratings","Check wiring, grounding and protective-device design","Have a qualified instructor inspect the deenergized assembly","Energize only under the authorized test procedure and observe results"],"correct":[0,1,2,3],"lesson":"A successful test starts from an inspected design and predictable behavior.","tip":"What should be checked before applying voltage?","wrong":"Testing with electricity is not a substitute for checking connections first."}]},{"id":"machine","name":"Machine Shop & CNC","short":"Machine Shop","icon":"⌁","tagline":"The aluminum hall pass came from HERE.","intro":"Lathe, drill press, mill, CNC router, workholding, chips, coolant, sharp tools. A machine can make nearly anything. Respect its energy and you can learn the language of fabrication.","legend":"Some kid asks for a hall pass. The instructor hands him a milled aluminum one. Suddenly the universe gets a machine shop.","briefings":[["01 / ROTATION WINS EVERY ARGUMENT","Secure hair, jewelry and clothing. Avoid gloves around exposed rotating spindles, chucks, drills and workpieces where they can snag. Follow machine-specific PPE requirements."],["02 / CLAMP BEFORE YOU CUT","Workholding and tool retention determine where energy goes. Verify the setup, travel, guarding, and proper speeds/feeds under trained supervision."],["03 / CHIPS ARE TINY KNIVES","Use approved chip brushes/hooks after safe stop/isolation, not bare hands. Select eye/face protection for chips and coolant. Never grab long ribbon swarf."],["04 / CNC IS A ROBOT WITH A TOOL","Verify the program, units, offsets, toolpaths, fixturing, enclosure/interlocks and a safe dry run or simulation before cutting material."]],"tasks":[{"id":"M01","type":"audit","title":"The lathe audition","scene":"A lathe is ready for a demonstration. What must be corrected?","options":["An operator wears loose gloves near a turning chuck","Long hair is secured under appropriate protection","Chuck key remains in the chuck","Workpiece and tool are correctly secured","A dangling necklace hangs near the spindle","A safety shield is in position"],"correct":[0,2,4],"lesson":"Rotating chucks can grab loose objects instantly. Remove keys, secure stock, protect eyes, and keep entanglement hazards away.","tip":"Anything loose that can reach the rotating system deserves attention.","wrong":"No jacket or glove is faster than a powered spindle."},{"id":"M02","type":"choice","title":"Hot metal spaghetti","scene":"The lathe produces a long ribbon of sharp swarf. What is the appropriate response?","options":["Grab it before it makes a mess","Wrap it around a gloved hand","Keep clear; stop/isolate as required and remove it using approved tools and procedures","Blow it at your friend with compressed air"],"correct":[2],"lesson":"Sharp, hot metal chips can cut, burn, and entangle. Trained operators use the correct chip-removal tools and safe machine state.","tip":"A ribbon-shaped chip can wrap around rotating work.","wrong":"A glove can protect skin from a sharp edge but become a serious hazard around rotation."},{"id":"M03","type":"multi","title":"The basic CNC review","scene":"Before a first milling run, select the checks that matter.","options":["Confirm units, stock size and work offsets","Check clamping, tools, travel and clearances","Review toolpath in simulation or appropriate safe test","Defeat the enclosure interlock to see better","Know where the emergency stop is and how it functions","Assume the first program is perfect because it came from AI"],"correct":[0,1,2,4],"lesson":"CAD/CAM/AI can make powerful starting points. Verification of geometry, offsets and machine behavior is what makes them usable.","tip":"A correct drawing can still become a wrong machine movement.","wrong":"A clever program is not a verified program."},{"id":"M04","type":"order","title":"First CNC run","scene":"Arrange a responsible first-run sequence conceptually.","options":["Confirm job requirements, material and machine capabilities","Inspect setup: tools, fixtures, stock, offsets and guards","Review/simulate program and perform supervised safe verification","Run authorized operation and monitor from a protected position"],"correct":[0,1,2,3],"lesson":"The first test cut is earned through setup, not bravery.","tip":"Simulation and setup verification happen before committing material.","wrong":"A screen preview cannot repair a loose clamp."},{"id":"M05","type":"audit","title":"The drill press surprise","scene":"A drill press station has several details. Find the real hazards.","options":["A small workpiece is held by fingers instead of a vise/clamp","The workpiece is securely clamped","Hair is loose beside the rotating chuck","Drill bit is sound and guards are in place","The chuck key is still installed","Eye protection is worn"],"correct":[0,2,4],"lesson":"Workpieces can catch and spin, and accessories can become projectiles. Holding by hand is not a vise.","tip":"Think what rotates besides the drill bit if the tool catches.","wrong":"A chuck key is not supposed to become airborne."},{"id":"M06","type":"choice","title":"The machine is quiet...","scene":"The spindle switch is off, but a tool is still coasting. You need to clear chips near it.","options":["Touch it gently to speed up stopping","Wait for full stop and follow the approved isolation/chip-clear procedure","Use compressed air while it coasts","Ask a friend to stop it by hand"],"correct":[1],"lesson":"Rotating masses retain energy after shutoff. Waiting for stop and following servicing/cleanup procedures avoids unnecessary contact.","tip":"An electric motor can be silent while attached metal still moves.","wrong":"“Off” is not a synonym for “motionless.”"},{"id":"M07","type":"multi","title":"What belongs on the setup card?","scene":"You are cutting a small aluminum bracket. Select relevant readiness information.","options":["Drawing dimensions, tolerances and material","Stock and fixture/workholding plan","Tool selection and machine limits","The machinist’s lucky horoscope","PPE, guarding, coolant and chip plan","Ignore actual machine measurements if the CAD looks nice"],"correct":[0,1,2,4],"lesson":"Machining is accurate description made physical. Tolerances, fixturing, tools and measurable checks connect the drawing to reality.","tip":"The plan must answer what, where, how, and how to verify.","wrong":"Cosmic optimism is not a tolerance stack-up."},{"id":"M08","type":"order","title":"The hall pass gets made","scene":"A school wants to machine an aluminum hall pass. Arrange the learning workflow.","options":["Define finished shape, dimensions, material and tolerances","Choose machine/tooling, workholding and verified safe process","Review the setup and toolpath with the instructor and apply controls","Fabricate under supervision, then measure the finished artifact"],"correct":[0,1,2,3],"lesson":"The reveal is simple: “You can make this? Here?” Yes. The work begins by describing it precisely enough to be fabricated and checked.","tip":"A material artifact is the last step in a chain of decisions.","wrong":"Let the learner see a real part, then trace the process that made it."}]}],"exam":[{"id":"F01","type":"choice","title":"The eye that sees twice","scene":"At a shared bench, grinding sparks land near someone wearing ordinary sunglasses.","options":["Sunglasses and a charming smile are fine","Choose impact-rated eyewear with needed side protection; add face protection where the task requires","Only turn the lights off","Move the person closer so they can see the sparks"],"correct":[1],"lesson":"Match protection to projectile and face hazards, not to fashion.","tip":"Think impact and side-entry risk.","wrong":"Dark lenses do not automatically mean impact protection."},{"id":"F02","type":"choice","title":"A cross-shop chemical surprise","scene":"A paint thinner container appears in the mechanics bay with no readable label.","options":["Identify it before use, consult proper labeling/SDS and responsible staff","Assume it is gasoline","Mix it into used oil","Leave it by the heater for someone to find"],"correct":[0],"lesson":"Chemicals do not become harmless when carried between departments.","tip":"The first piece of missing information is identity.","wrong":"Unknown liquid is not a general-purpose tool."},{"id":"F03","type":"choice","title":"The three-energy machine","scene":"A machine has electrical supply, compressed air and a gravity-loaded fixture. It stops after E-stop.","options":["It is safe because the motor is silent","Only air matters now","Follow authorized energy-control procedure addressing electrical, pneumatic and gravity sources; verify safe state","Ask someone to touch it to check"],"correct":[2],"lesson":"Energy inventories must cover every source that could move a machine during servicing.","tip":"List all the sources, not just the one that stopped humming.","wrong":"The red mushroom button does not eliminate stored gravity."},{"id":"F04","type":"choice","title":"A neat freak with compressed air","scene":"A student cleans wood and metal dust by blowing clouds into the room.","options":["Good; the floor is clean now","Use appropriate collection, vacuum/brush and procedures for the material instead","Point the nozzle toward other people","Keep doing it if the room looks impressive"],"correct":[1],"lesson":"Airborne debris creates exposure and sometimes fire concerns; controlled collection is the objective.","tip":"A dust cloud is a relocation, not removal.","wrong":"Tiny particles are not improved by making them airborne."},{"id":"F05","type":"choice","title":"The hidden current","scene":"An apprentice trusts the wall label “OFFICE OUTLET” and opens a connected electrical assembly.","options":["Labels alone prove isolation","A qualified person identifies sources, isolates, and verifies absence of voltage under the correct procedure","The label probably has good intentions","Use a wet rag to see if it sparks"],"correct":[1],"lesson":"Verification requires a qualified person and appropriate instruments, not faith in a sticker.","tip":"What evidence is required beyond a label?","wrong":"Labels sometimes outlive wiring changes."},{"id":"F06","type":"choice","title":"The romantic spray booth","scene":"An unapproved ordinary heater is placed beside flammable spray material to keep a student warm.","options":["More heat cures the paint faster","Remove ignition hazards and use compliant spray area ventilation/equipment controls","Just turn the heater toward the wall","Open more spray cans so fumes dissipate"],"correct":[1],"lesson":"Paint spray can create flammable atmospheres. Equipment and ignition controls must be designed for that risk.","tip":"What might the vapor find on a heater?","wrong":"Temperature comfort is not a reason to introduce an ignition source."},{"id":"F07","type":"choice","title":"The mystery rattle","scene":"An engine runs inside a closed garage during a long diagnosis.","options":["Carbon monoxide extraction and suitable ventilation are needed","Carbon monoxide announces itself by odor","A fan pointed at the technician is always enough","A cloth mask filters the exhaust gases"],"correct":[0],"lesson":"CO exposure is a silent risk; implement suitable exhaust extraction/ventilation.","tip":"You cannot rely on your nose.","wrong":"A masked face is not a designed exhaust path."},{"id":"F08","type":"choice","title":"The late-shift rush","scene":"A saw user sees a narrow offcut against the blade and the tool is still coasting.","options":["Sweep with a bare hand","Wait for safe stop/isolation as required and clear with proper tool","Wear thicker rings","Get another person to grab it"],"correct":[1],"lesson":"The body must remain clear of coasting cutting tools.","tip":"The motor being switched off does not prove no motion.","wrong":"Offcuts are cheaper than fingers."},{"id":"F09","type":"choice","title":"CAD made this, therefore…","scene":"An AI-generated CNC toolpath looks beautiful. No one has reviewed units or offsets.","options":["Run it. The robot has confidence","Review dimensions, units, offsets, workholding, guarding and simulate/check before authorized run","Bypass the interlock and film it","Add a higher spindle speed as tribute"],"correct":[1],"lesson":"Description, simulation and measured verification bridge AI assistance to a real machine.","tip":"A good-looking model can still be translated into bad motion.","wrong":"A digital render cannot test a physical clamp."},{"id":"F10","type":"choice","title":"Noise doesn’t negotiate","scene":"Two students finish a loud shift and one reports ringing ears.","options":["Normal; ignore it","Assess and control noise exposure, ensure appropriate hearing protection and report symptoms","Shout to test their hearing","Tell them to avoid music forever"],"correct":[1],"lesson":"Hearing symptoms are evidence worth acting on; noise controls and protection need attention.","tip":"Think exposure and symptoms, not toughness.","wrong":"Tinnitus is not a medal for surviving class."},{"id":"F11","type":"choice","title":"The raised-car shortcut","scene":"A jack raises a vehicle; the tech wants to crawl beneath before setting approved support.","options":["Go quickly while pressure holds","Use the approved support/verification procedure before entering the space beneath","Put a tire under your head","Ask the student to hold the jack handle"],"correct":[1],"lesson":"Gravity is the simplest hazard in the shop and one of the least forgiving.","tip":"What remains if the jack loses pressure?","wrong":"Confidence is not rated load support."},{"id":"F12","type":"choice","title":"The professional pause","scene":"You spot a condition not covered by the posted procedure while setting up a machine.","options":["Assume it is normal because the last person worked there","Stop, secure the area as appropriate, and consult the responsible qualified instructor/person before proceeding","Try different speeds until it stops making noise","Say nothing because asking questions looks weak"],"correct":[1],"lesson":"A good fabricator recognizes when the evidence is incomplete and prevents exposure while resolving it.","tip":"An unknown condition deserves information before motion.","wrong":"The professional move is to stop the unknown from becoming a known injury."}]};
const KEY='bekw.hall-pass.safety.v1';
const ALL=[...COURSE.shops.flatMap(s=>s.tasks),...COURSE.exam];
const BYID=Object.fromEntries(ALL.map(t=>[t.id,t]));
const SHOPMAP=Object.fromEntries(COURSE.shops.map(s=>[s.id,s]));
const initialState=()=>({version:1,done:{},view:'home',shop:'core',current:null,mute:true,seenPass:false});
function load(){try{const raw=JSON.parse(localStorage.getItem(KEY));if(!raw||raw.version!==1)return initialState();const clean=initialState();clean.done=Object.fromEntries(Object.entries(raw.done||{}).filter(([k,v])=>BYID[k]&&v&&typeof v==='object').map(([k,v])=>[k,{attempts:Math.max(0,Math.min(9999,Number(v.attempts)||0)),at:v.at||null,hint:!!v.hint}]));clean.view=['home','shops','exam','manual'].includes(raw.view)?raw.view:'home';clean.shop=SHOPMAP[raw.shop]?raw.shop:'core';clean.current=BYID[raw.current]?raw.current:null;clean.mute=raw.mute!==false;clean.seenPass=!!raw.seenPass;return clean}catch{return initialState()}}
let state=load(),attempts={},feedback=null,activeSelections=new Set(),displayOrder=[],examStarted=false,shiftSeed=Math.random();
const app=document.getElementById('app'),elImport=document.getElementById('importFile');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const countDone=arr=>arr.filter(t=>state.done[t.id]).length;
const mainCount=()=>countDone(COURSE.shops.flatMap(s=>s.tasks));
const totalDone=()=>countDone(ALL);
const allShopsDone=()=>mainCount()===48;
const isUnlocked=s=>s.id==='core'||countDone(SHOPMAP.core.tasks)===8;
const mkbtn=(action,label,cls='',extra='')=>`<button type="button" class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('Browser storage is unavailable. Export your progress if needed.')}}
function notify(msg){let old=document.querySelector('.toast');if(old)old.remove();let t=document.createElement('div');t.className='toast';t.role='status';t.textContent=msg;document.body.append(t);setTimeout(()=>{if(t.isConnected)t.remove()},4000)}
function resetTask(task){feedback=null;activeSelections=new Set();if(task?.type==='order'){displayOrder=task.options.map((_,i)=>i);for(let j=displayOrder.length-1;j>0;j--){let k=Math.floor(Math.random()*(j+1));[displayOrder[j],displayOrder[k]]=[displayOrder[k],displayOrder[j]]}if(displayOrder.every((x,i)=>x===i))displayOrder=[1,2,3,0]}else displayOrder=[];shiftSeed=Math.random()}
function selectTask(id){if(!BYID[id])return;if(id[0]==='F'&&!allShopsDone()){notify('Finish the six shop rotations to open the final inspection.');return}const owner=COURSE.shops.find(s=>s.tasks.some(t=>t.id===id));if(owner&&!isUnlocked(owner)){state.shop='core';state.view='shops';state.current='C01';notify('Orientation first. The shop door opens after the First Bell safety rotation.')}else{state.current=id;if(owner)state.shop=owner.id;state.view=owner?'shops':'exam'}resetTask(BYID[state.current]);save();render();document.getElementById('challenge')?.scrollIntoView({block:'start',behavior:'smooth'})}
function nextTask(){const pool=state.view==='exam'?COURSE.exam:SHOPMAP[state.shop].tasks;const pending=pool.filter(t=>!state.done[t.id]);if(!pending.length){if(state.view==='exam'){state.view='exam'}else{state.current=null;}feedback=null;save();render();return}selectTask(pending[0].id)}
function statsHTML(){const n=totalDone();return `<div class="statusBar"><div class="counter">${String(n).padStart(2,'0')} <span style="color:#7f9895;font-size:.7em">/ 60</span></div><div class="meter" role="progressbar" aria-label="Missions completed" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="60"><div class="fill" style="width:${(n/60*100).toFixed(2)}%"></div></div><span class="statLabel">${n===60?'FOUNDATIONS COMPLETE':'Six rotations · 48 shop missions + 12 final decisions'}</span></div>`}

" font-family="monospace">P.A. / N.J. / 001</text></svg>`;
function hero(){return `<section class="hero"><div><div class="eyebrow"><b>BEKW-CODE</b> / LEARNING BY MAKING / JERSEY BORN</div><h1>THE<br><span>HALL PASS.</span></h1><p class="lede">An old shop instructor carved a hall pass out of aluminum. One kid held it, stared, and asked: <strong>“You can make this? HERE?”</strong></p><p class="joke">You like your eyes? Enjoy seeing things? Excellent. Here are safety glasses.</p><div class="heroButtons">${mkbtn('start','ENTER THE SHOP →','primary')}${mkbtn('manual','HOW TO PLAY','ghost')}</div><div style="color:#a9c6b8;font-size:12px;margin-top:13px">Free forever · Entirely offline · No login · Local progress</div></div><div class="heroVisual"><div id="passWrap" class="passWrap ${state.seenPass?'flipped':''}">${passSVG}</div><button class="btn small ghost" data-action="flip" style="margin-top:14px">${state.seenPass?'Look again at the pass':'Inspect the aluminum pass ↗'}</button><div class="passMessage" id="passMessage">${state.seenPass?'THE MACHINE THAT MADE IT IS RIGHT HERE.':'THE FIRST MACHINE IS CURIOSITY.'}</div><div class="passCaption">Not an official school program · A tribute to Perth Amboy vocational learning.</div></div></section>`}
function homeView(){return `${hero()}${statsHTML()}<div class="sectionLead"><div><div class="eyebrow">THE SIX ROTATIONS</div><h2>Find the hazard. Learn the tool. Make the thing.</h2></div><p>Explore all shops after the First Bell.</p></div><section class="gallery">${COURSE.shops.map(s=>`<article class="galleryCard"><span class="big">${s.icon}</span><span class="tag">${s.id==='core'?'First bell':'Shop rotation'}</span><h4>${esc(s.name)}</h4><p>${esc(s.tagline)}</p><p style="margin:10px 0;color:var(--accent)">${countDone(s.tasks)} / 8 missions</p>${mkbtn('openshop',isUnlocked(s)?'Open shop →':'Preview after First Bell','small ghost',`data-shop="${s.id}"`)}</article>`).join('')}</section><section class="panel" style="margin-top:18px"><div class="panelTop"><div><div class="eyebrow">THE ALUMINUM MOMENT</div><h2>First, show what’s possible.</h2><p style="max-width:750px">A finished object opens the door. Then the learner works backward: what machine made it, what did the operator need to know, and how did they keep the work under control?</p></div><div class="largeIcon">⌁</div></div><p class="quotation">You don’t need to be born an engineer. You need someone to show you that a machine can make the impossible look ordinary.</p></section>`}
function rail(){return `<aside class="shopRail" aria-label="Shop navigation">${COURSE.shops.map(s=>`<button class="shopBtn" data-action="openshop" data-shop="${s.id}" aria-current="${state.shop===s.id?'true':'false'}"><div class="shopBtnIcon">${s.icon}</div><div><h4>${esc(s.name)} ${isUnlocked(s)?'':'🔒'}</h4><small>${countDone(s.tasks)} / 8 · ${isUnlocked(s)?'Open':'First Bell needed'}</small><div class="railmeter"><b style="width:${countDone(s.tasks)*12.5}%"></b></div></div></button>`).join('')}</aside>`}
function shopView(){const s=SHOPMAP[state.shop]||SHOPMAP.core;const done=countDone(s.tasks),complete=done===8;let chosen=state.current&&s.tasks.find(t=>t.id===state.current);if(!chosen){chosen=s.tasks.find(t=>!state.done[t.id])||s.tasks[0];if(state.current!==chosen.id){state.current=chosen.id;resetTask(chosen);save()}}return `${statsHTML()}<div class="sectionLead"><div><div class="eyebrow">SHOP ROTATION / ${esc(s.short.toUpperCase())}</div><h2>Six doors. An entire world behind them.</h2></div><p>Choose missions in any order. Corrections never cost progress.</p></div><div class="workspace">${rail()}<div class="workMain"><section class="panel heroPanel"><div class="panelTop"><div><div class="eyebrow">${s.id==='core'?'FIRST BELL / SHOP ACCESS':'ROTATION / SHOP '+(COURSE.shops.indexOf(s)+1)}</div><h2>${esc(s.name)}</h2><p class="lede" style="font-size:16px">${esc(s.intro)}</p></div><div class="largeIcon">${s.icon}</div></div><p class="quotation">${esc(s.legend)}</p>${complete?`<div class="tag good">✓ ROTATION COMPLETE — ALL EIGHT MISSIONS</div>`:`<div class="tag gold">${done} / 8 MISSIONS COMPLETE</div>`}</section><section class="panel"><div class="eyebrow">FOREMAN'S BRIEFING / READ ANYTIME</div><h3>Four facts worth keeping your fingers for</h3><div class="noteGrid">${s.briefings.map(b=>`<div class="noteCard"><h4>${esc(b[0])}</h4><p>${esc(b[1])}</p></div>`).join('')}</div></section><section class="panel"><div class="eyebrow">SHOP MISSIONS</div><h3>The tools don't come with a cheat code.</h3><p style="font-size:13px">Choose a mission. Diagnose the situation. Your choices stay put when a check fails. Each solved scenario counts once; replay is always free.</p><div class="missionGrid">${s.tasks.map((t,i)=>`<button class="mission" data-action="task" data-id="${t.id}" aria-current="${t.id===chosen.id?'true':'false'}"><span class="miNum">${String(i+1).padStart(2,'0')} · ${typeName(t.type)}</span><span class="miTitle">${esc(t.title)}</span><span class="miState">${state.done[t.id]?'✓ COMPLETED':'OPEN / NOT SOLVED'}</span></button>`).join('')}</div></section>${taskHTML(chosen)}${complete?`<section class="panel"><h3>That shop is yours. You earned the fundamentals.</h3><p>Eight independent decisions made and explained. The next room awaits.</p>${mkbtn('nextshop','NEXT SHOP →','primary')}</section>`:''}</div></div>`}
function typeName(t){return {audit:'HAZARD AUDIT',choice:'DECISION',multi:'CONTROL SELECT',order:'SEQUENCE'}[t]||t}
function choicePermutation(t){let arr=t.options.map((_,i)=>i);const seed=[...t.id].reduce((x,c)=>(x*33+c.charCodeAt(0))>>>0,917)+Math.floor(shiftSeed*999999);let rng=(seed|0)||1;for(let i=arr.length-1;i>0;i--){rng^=rng<<13;rng^=rng>>>17;rng^=rng<<5;let j=(rng>>>0)%(i+1);[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
let optionOrderCache={};function optionOrder(t){if(t.type!=='choice')return t.options.map((_,i)=>i);if(!optionOrderCache[t.id])optionOrderCache[t.id]=choicePermutation(t);return optionOrderCache[t.id]}
function taskHTML(t){const done=!!state.done[t.id];return `<section class="challenge" id="challenge" aria-label="Active challenge"><div class="challengeHead"><span class="tag gold">${esc(t.id)} / ${typeName(t.type)}</span><span class="tag ${done?'good':'dim'}">${done?'✓ RECORDED':'NOT YET SOLVED'}</span></div><h3>${esc(t.title)}</h3><div class="scene">${esc(t.scene)}</div>${t.type==='order'?`<div class="prompt">REORDER THE STEPS — USE ↑ AND ↓</div><div class="sequence">${displayOrder.map((originalIdx,pos)=>`<div class="seqrow"><div class="seqnum">${pos+1}</div><div class="seqtext">${esc(t.options[originalIdx])}</div><div class="seqControls"><button aria-label="Move step ${pos+1} up" data-action="move" data-pos="${pos}" data-dir="-1" ${pos===0?'disabled':''}>↑</button><button aria-label="Move step ${pos+1} down" data-action="move" data-pos="${pos}" data-dir="1" ${pos===displayOrder.length-1?'disabled':''}>↓</button></div></div>`).join('')}</div>`:`<div class="prompt">${t.type==='choice'?'CHOOSE THE BEST RESPONSE':t.type==='multi'?'SELECT EVERY CONTROL THAT BELONGS':'INSPECT THE SCENE · MARK ALL HAZARDS'}</div><div class="optionGrid ${t.type==='audit'?'audit':''}">${optionOrder(t).map((o,i)=>`<button class="option" data-action="select" data-idx="${o}" aria-pressed="${activeSelections.has(o)}"><span class="optionMark">${t.type==='choice'?String.fromCharCode(65+i):activeSelections.has(o)?'✓':'+'}</span><span>${esc(t.options[o])}</span></button>`).join('')}</div>`}<div class="challengeActions">${mkbtn('check','CHECK THE WORK →','primary')}${mkbtn('hint','PRINCIPLE HINT','ghost')}${mkbtn('reveal','REVEAL REASONING','ghost')}${mkbtn('resetTask','RESET THIS ATTEMPT','ghost')}</div>${feedback?feedbackHTML(t):''}<div class="miniHelp">A wrong check changes nothing about your choices or prior completions. The machine doesn't shame you; it just provides evidence.</div></section>`}
function feedbackHTML(t){const f=feedback;const type=f.kind==='correct'?'success':f.kind==='wrong'?'warning':'info';let detail=f.kind==='correct'?t.lesson:f.kind==='wrong'?t.wrong:f.kind==='hint'?t.tip: f.kind==='reveal'?`Review the safe pattern: ${correctAnswerText(t)}. ${t.lesson}`:'';return `<div class="result ${type}" role="status"><strong>${esc(f.kind==='correct'?'✓ GOOD DIAGNOSIS — THAT’S HOW AN INSPECTOR THINKS':f.kind==='wrong'?'NOT QUITE. YOUR WORK IS STILL HERE.':f.kind==='hint'?'FOREMAN’S PRINCIPLE HINT':'SOLUTION REVIEW — PRACTICE BEFORE CREDIT')}</strong><p>${esc(detail)}</p>${f.kind==='correct'?`<div style="margin-top:13px">${mkbtn('next','NEXT MISSION →','primary small')}</div>`:''}</div>`}
function correctAnswerText(t){if(t.type==='order')return t.options.map((x,i)=>(i+1)+'. '+x).join(' → ');return t.correct.map(i=>t.options[i]).join(' / ')}
function check(){const t=BYID[state.current];if(!t)return;let right=false;if(t.type==='order')right=displayOrder.length===t.correct.length&&displayOrder.every((x,i)=>x===t.correct[i]);else right=activeSelections.size===t.correct.length&&t.correct.every(i=>activeSelections.has(i));attempts[t.id]=(attempts[t.id]||0)+1;if(right){if(!state.done[t.id]){state.done[t.id]={attempts:attempts[t.id],at:new Date().toISOString(),hint:false};save();if(!state.mute)ding()}feedback={kind:'correct'}}else feedback={kind:'wrong'};render();document.getElementById('challenge')?.scrollIntoView({block:'nearest'})}
function examView(){const unlocked=allShopsDone();return `${statsHTML()}<section class="panel heroPanel"><div class="eyebrow">CAPSTONE / SIX SHOPS, ONE HEAD ON YOUR SHOULDERS</div><h2>THE FINAL INSPECTION.</h2><p>The shop has been generous with tools. Now show that you can spot what can go wrong before it does.</p>${unlocked?'<span class="tag good">ALL SHOP ROTATIONS CLEARED</span>':`<span class="tag gold">FINISH ALL SIX ROTATIONS TO UNLOCK · ${mainCount()} / 48</span>`}</section>${unlocked?`<section class="panel"><h3>Twelve new cases. Every one counts.</h3><p>These are new cross-shop situations, not copies of the practice missions. Solve them in any order, then claim your digital foundation record.</p><div class="missionGrid">${COURSE.exam.map((t,i)=>`<button class="mission" data-action="task" data-id="${t.id}" aria-current="${state.current===t.id?'true':'false'}"><span class="miNum">${String(i+1).padStart(2,'0')} · CROSS-SHOP</span><span class="miTitle">${esc(t.title)}</span><span class="miState">${state.done[t.id]?'✓ COMPLETE':'OPEN'}</span></button>`).join('')}</div></section>${totalDone()===60?certificateHTML():taskHTML(COURSE.exam.find(t=>t.id===state.current)||COURSE.exam.find(t=>!state.done[t.id])||COURSE.exam[0])}`:`<section class="panel"><p><strong>Safety is the front door.</strong> First clear the shared orientation, then the five trades. Your progress is saved locally.</p>${mkbtn('shops','BACK TO ROTATION →','primary')}</section>`}`}
function certificateHTML(){return `<section class="certificate"><div class="cert-mark">⌁</div><div class="eyebrow">BEKW-CODE / THE HALL PASS</div><h2>FOUNDATIONS COMPLETE.</h2><p>Six shop rotations. Sixty practical decisions. Every required scenario completed.</p><p><strong>SAFE THINKING IS A MAKER SKILL.</strong></p><p class="statLabel">Digital practice record · Not a trade qualification or workplace authorization</p><div class="heroButtons" style="justify-content:center">${mkbtn('print','PRINT YOUR RECORD','primary')}${mkbtn('export','EXPORT PROGRESS','ghost')}</div></section>`}
const sources=[
['OSHA 1910.133 · Eye and face protection','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.133'],
['OSHA 1910.95 · Occupational noise exposure','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.95'],
['OSHA 1910.147 · Hazardous energy / lockout-tagout','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.147'],
['OSHA 1910.212 · General machine guarding','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.212'],
['OSHA 1910.213 · Woodworking machines','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.213'],
['OSHA 1910.107 · Spray finishing','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.107'],
['OSHA 1910.134 · Respiratory protection','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.134'],
['OSHA 1910.333 · Electrical work practices','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.333'],
['OSHA 1910.1200 · Hazard communication','https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.1200'],
['OSHA woodworking eTool · Point of operation','https://www.osha.gov/etools/woodworking/machine-hazards/point-of-operation']];
function manualView(){return `${statsHTML()}<section class="panel manual"><div class="eyebrow">THE SHOP MANUAL</div><h2>HOW TO USE THE HALL PASS</h2><p>It's a school built around a moment of discovery. Someone hands you a finished aluminum part. You learn that ordinary people in this very room can make one. Safety isn't a lecture before the interesting thing—it is the skill that lets you make the next one.</p><details open><summary>START: THE SIX-SHOP ROTATION</summary><p>Start with <strong>First Bell</strong>. Complete its eight practical missions to open the five trades. Each shop contains four short briefing cards and eight hands-on reasoning challenges: inspect hazards, make a decision, select controls, and sequence a procedure. Completing all 48 opens twelve new capstone cases.</p></details><details><summary>CONTROLS — NOTHING HIDDEN</summary><p><strong>Audit / Control Select:</strong> click or tap every relevant tile; click again to deselect. <strong>Decision:</strong> select one response. <strong>Sequence:</strong> use ↑ and ↓ beside each step to put it in order. Select <strong>CHECK THE WORK</strong> when ready. Hints are optional and explain principles, not solutions. <strong>REVEAL REASONING</strong> is a separate, deliberate choice; it does not award completion.</p></details><details><summary>PROGRESS, SOUND, OFFLINE</summary><p>Completed scenarios stay complete. A mistake never erases work or takes away progress. Local storage keeps the completed IDs on this browser, if browser settings permit. Export your journal as JSON to keep it; import deliberately replaces the browser's current journal. Sound is off by default and only plays a small confirmation tone when enabled. No audio, fonts, scripts, trackers or data are fetched over the network.</p><div class="heroButtons">${mkbtn('export','EXPORT PROGRESS','ghost')}${mkbtn('import','IMPORT PROGRESS','ghost')}${mkbtn('erase','ERASE LOCAL PROGRESS','danger')}</div></details><details><summary>WHY THE NUMBERS MATTER</summary><p><strong>Hearing:</strong> OSHA’s general-industry hearing conservation program is triggered at 85 dBA as an 8-hour time-weighted average. This is a program action level, not a blanket guarantee of safety. <strong>Eyes:</strong> protection must match hazards and include side protection where flying objects are a risk. <strong>Respirators:</strong> required workplace use involves appropriate selection, medical evaluation, training and fit testing for tight-fitting models. <strong>Electricity:</strong> a qualified person verifies deenergized state under prescribed procedures.</p></details><details><summary>PROVENANCE + SCOPE</summary><p>This game is an original educational tribute to the user’s experience of Perth Amboy vocational education in New Jersey. It is not an official Perth Amboy school product. The exercises teach general safety reasoning; actual machine access and specific work require applicable procedures, qualified instruction and workplace authorization. No OSHA training-completion or professional credential is implied.</p><p>The examples draw from OSHA requirements and guidance listed below. Applicable rules differ by operation and jurisdiction; the game presents conceptual principles, not legal advice or machine-specific instructions.</p></details><details><summary>MAKE IT A LIVE GITHUB PAGES LINK</summary><p>Upload this one HTML file into a GitHub repository and name it <code>index.html</code>. In the repository, open <strong>Settings → Pages</strong>, select <strong>Deploy from a branch</strong>, choose your publishing branch and root folder, then save. Once GitHub Pages finishes publishing, its listed URL becomes the live game link you can share. The same file also runs offline after download. Existing repositories and deployments are not changed by this game.</p></details><h3>Primary technical references</h3><p style="font-size:12px;color:var(--mute)">Links open online only when you choose them. No resource is requested by the game itself.</p><div class="sourceList">${sources.map(s=>`<a href="${s[1]}" rel="noopener noreferrer" target="_blank">${esc(s[0])} ↗</a>`).join('')}</div></section>`}
function render(){if(state.view==='exam'&&!allShopsDone()){state.current=null}else if(state.view==='exam'&&(!state.current||state.current[0]!=='F')){state.current=COURSE.exam.find(t=>!state.done[t.id])?.id||'F01';resetTask(BYID[state.current])}app.innerHTML=state.view==='home'?homeView():state.view==='shops'?shopView():state.view==='exam'?examView():manualView();document.getElementById('soundButton').textContent='Sound: '+(state.mute?'off':'on');document.getElementById('soundButton').setAttribute('aria-pressed',String(!state.mute));document.title=`${totalDone()}/60 · THE HALL PASS · Digital Vo-Tech`;const c=document.getElementById('printCertificate');if(c)c.innerHTML=`<h1>THE HALL PASS</h1><hr><h2>SHOP SAFETY PRACTICE RECORD</h2><p>BEKW-CODE DIGITAL VO-TECH · An homage to Perth Amboy vocational learning</p><p>Missions completed: ${totalDone()} / 60 · Orientation and five trades</p><ul>${COURSE.shops.map(s=>`<li>${esc(s.name)}: ${countDone(s.tasks)}/8</li>`).join('')}<li>Final inspection: ${countDone(COURSE.exam)}/12</li></ul><p>Practice record only; this is not a professional qualification or authorization to work on machines.</p><p>Date printed: ${new Date().toLocaleDateString()}</p><p>BEST BUILD WINS · WE GIVE THE PEOPLE THEIR OWN LOBSTER</p>`}
function ding(){try{const Context=window.AudioContext||window.webkitAudioContext;if(!Context)return;let cx=new Context();[0,0.11].forEach((delay,i)=>{let osc=cx.createOscillator(),gain=cx.createGain();osc.type='sine';osc.frequency.value=i?785:523;gain.gain.setValueAtTime(.0001,cx.currentTime+delay);gain.gain.exponentialRampToValueAtTime(.045,cx.currentTime+delay+.009);gain.gain.exponentialRampToValueAtTime(.0001,cx.currentTime+delay+.13);osc.connect(gain).connect(cx.destination);osc.start(cx.currentTime+delay);osc.stop(cx.currentTime+delay+.15)});setTimeout(()=>cx.close(),470)}catch{}}
function download(content,name,type='application/json'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',ev=>{const button=ev.target.closest('button[data-action]');if(!button||button.disabled)return;const action=button.dataset.action;
if(['home','shops','exam','manual'].includes(action)){if(action==='shops'){state.shop=SHOPMAP[state.shop]?state.shop:'core';if(!isUnlocked(SHOPMAP[state.shop]))state.shop='core';state.current=null}else if(action==='exam'){state.current=null}else if(action==='home')state.current=null;state.view=action;feedback=null;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
if(action==='start'){state.view='shops';state.shop='core';state.current=null;feedback=null;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
if(action==='openshop'){let id=button.dataset.shop;state.shop=isUnlocked(SHOPMAP[id])?id:'core';state.current=null;state.view='shops';feedback=null;save();render();window.scrollTo({top:0,behavior:'smooth'});if(id!==state.shop)notify('First Bell first. Eight shop-safety decisions open the rest.');return}
if(action==='task'){selectTask(button.dataset.id);return}
if(action==='select'){const t=BYID[state.current];const idx=Number(button.dataset.idx);if(t.type==='choice')activeSelections=new Set([idx]);else if(activeSelections.has(idx))activeSelections.delete(idx);else activeSelections.add(idx);feedback=null;render();return}
if(action==='move'){let pos=Number(button.dataset.pos),next=pos+Number(button.dataset.dir);if(next<0||next>=displayOrder.length)return;[displayOrder[pos],displayOrder[next]]=[displayOrder[next],displayOrder[pos]];feedback=null;render();return}
if(action==='check'){check();return}
if(action==='hint'){feedback={kind:'hint'};render();return}
if(action==='reveal'){if(!confirm('Reveal the correct reasoning? This attempt will not earn a completion.'))return;feedback={kind:'reveal'};render();return}
if(action==='resetTask'){resetTask(BYID[state.current]);optionOrderCache={};render();return}
if(action==='next'){nextTask();return}
if(action==='nextshop'){let idx=COURSE.shops.findIndex(s=>s.id===state.shop);if(idx<5){state.shop=COURSE.shops[idx+1].id;state.current=null;state.view='shops'}else{state.current=null;state.view='exam'}feedback=null;save();render();window.scrollTo({top:0,behavior:'smooth'});return}
if(action==='flip'){state.seenPass=!state.seenPass;save();const pass=document.getElementById('passWrap'),msg=document.getElementById('passMessage');pass?.classList.toggle('flipped',state.seenPass);if(msg)msg.textContent=state.seenPass?'THE MACHINE THAT MADE IT IS RIGHT HERE.':'THE FIRST MACHINE IS CURIOSITY.';button.textContent=state.seenPass?'Look again at the pass':'Inspect the aluminum pass ↗';return}
if(action==='sound'){state.mute=!state.mute;save();render();if(!state.mute)ding();return}
if(action==='export'){download(JSON.stringify({game:'BEKW-THE-HALL-PASS',schema:1,exported:new Date().toISOString(),done:state.done},null,2),'HALL_PASS_progress.json');return}
if(action==='import'){elImport.click();return}
if(action==='erase'){if(!confirm('Erase all locally saved Hall Pass progress in this browser? Export first if you want a copy.'))return;state=initialState();feedback=null;activeSelections=new Set();save();render();notify('Local journal reset. The shop is ready for another first day.');return}
if(action==='print'){window.print();return}
});
elImport.addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.game!=='BEKW-THE-HALL-PASS'||obj.schema!==1||!obj.done||typeof obj.done!=='object')throw Error('That is not a Hall Pass v1 progress file.');if(!confirm('Replace this browser’s Hall Pass progress with the imported record?'))return;const done={};for(const [id,v] of Object.entries(obj.done))if(BYID[id]&&v&&typeof v==='object')done[id]={attempts:Number(v.attempts)||1,at:typeof v.at==='string'?v.at:null,hint:!!v.hint};state.done=done;state.current=null;state.view='home';save();render();notify('Progress imported. '+totalDone()+' missions completed.')}catch(err){notify('Import not applied: '+err.message)}finally{elImport.value=''}});
render();
</script>
